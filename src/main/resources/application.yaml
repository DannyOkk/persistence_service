server:
  port: ${PORT:8080}

spring:
  application:
    name: persistence

  datasource:
    url: jdbc:postgresql://${DB_WRITE_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notebookum_db}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: persistence-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      test-query: SELECT 1
      initialization-fail-timeout: 10000

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: persistence-service
        health-check-path: /actuator/health
        health-check-interval: 15s
        prefer-ip-address: true
        tags:
          - "traefik.enable=true"
          - "traefik.http.routers.persistence-service.rule=Host(`persistence-java.universidad.localhost`)"
          - "traefik.http.routers.persistence-service.entryPoints=http,https"
          - "traefik.http.services.persistence-service.loadbalancer.server.port=8080"
      config:
        enabled: false

  sql:                              # ← agregado
    init:
      mode: always
      schema-locations: classpath:init.sql

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always