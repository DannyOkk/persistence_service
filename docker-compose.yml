services: 
    postgres-primary:
        image: postgres:16
        restart: unless-stopped
        environment:
        - POSTGRES_DB=${DB_NAME}
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        networks:
        - internal-network
        labels:
        - "traefik.enable=false"

    persistence-java:
        build: .
        image: notebookum-persistence-java:v1.0.0
        restart: unless-stopped
        depends_on:
            - postgres-primary
        # LOAD BALANCER PATTERN
        deploy:
            replicas: 2
        networks:
            notebookum-network:
                aliases:
                    - persistence-java.universidad.localhost
            internal-network:
                aliases:
                    - persistence-java-db
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.persistence-java.rule=Host(`persistence-java.universidad.localhost`)"
            - "traefik.http.routers.persistence-java.entryPoints=https"
            - "traefik.http.routers.persistence-java.tls=true"
            - "traefik.http.services.persistence-java.loadbalancer.server.port=8080"
            # CIRCUIT BREAKER PATTERN
            - "traefik.http.middlewares.cb-persistence-java.circuitbreaker.expression=LatencyAtQuantileMS(50.0) > 100 || ResponseCodeRatio(500, 600, 0, 600) > 0.30 || NetworkErrorRatio() > 0.10"
            # BULKHEAD PATTERN
            - "traefik.http.middlewares.bulkhead-persistence-java.inflightreq.amount=10"
            - "traefik.http.routers.persistence-java.middlewares=cb-persistence-java,bulkhead-persistence-java"
        environment:
            - PORT=8080
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            - DB_WRITE_HOST=${DB_WRITE_HOST:-postgres-primary}
            - DB_READ_HOST=${DB_READ_HOST:-postgres-replica}
            - DB_PORT=${DB_PORT:-5432}
            - DB_NAME=${DB_NAME}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}

networks:
    notebookum-network:
        external: true
    internal-network:
        internal: true
