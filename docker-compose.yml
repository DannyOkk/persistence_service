services:

    # ─── BASE DE DATOS ────────────────────────────────────────────────────────
    postgres-primary:
        image: postgres:16
        restart: unless-stopped
        environment:
            - POSTGRES_DB=${DB_NAME}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        networks:
            - internal-network
        labels:
            - "traefik.enable=false"

    # ─── REDIS ────────────────────────────────────────────────────────────────
    redis:
        image: redis:alpine
        restart: unless-stopped
        networks:
            - internal-network
        labels:
            - "traefik.enable=false"

    # ─── APLICACIÓN ──────────────────────────────────────────────────────────
    persistence-java:
        build: .
        image: notebookum-persistence-java:v1.0.0
        restart: unless-stopped
        depends_on:
            - postgres-primary
            - redis
        # LOAD BALANCER PATTERN
        deploy:
            replicas: 2
        networks:
            notebookum-network:
                aliases:
                    - persistence-java.universidad.localhost
            internal-network:
                aliases:
                    - persistence-java-db
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.persistence-java.rule=Host(`persistence-java.universidad.localhost`)"
            - "traefik.http.routers.persistence-java.entryPoints=https"
            - "traefik.http.routers.persistence-java.tls=true"
            - "traefik.http.services.persistence-java.loadbalancer.server.port=8080"
            # CORS via Traefik
            - "traefik.http.middlewares.cors-persistence.headers.accesscontrolalloworiginlist=*"
            - "traefik.http.middlewares.cors-persistence.headers.accesscontrolallowmethods=GET,POST,PATCH,DELETE,OPTIONS"
            - "traefik.http.middlewares.cors-persistence.headers.accesscontrolallowheaders=Content-Type,Authorization"
            - "traefik.http.middlewares.cors-persistence.headers.addvaryheader=true"
            # CIRCUIT BREAKER PATTERN
            - "traefik.http.middlewares.cb-persistence-java.circuitbreaker.expression=LatencyAtQuantileMS(50.0) > 100 || ResponseCodeRatio(500, 600, 0, 600) > 0.30 || NetworkErrorRatio() > 0.10"
            # BULKHEAD PATTERN
            - "traefik.http.middlewares.bulkhead-persistence-java.inflightreq.amount=10"
            - "traefik.http.routers.persistence-java.middlewares=cb-persistence-java,bulkhead-persistence-java,cors-persistence"
        environment:
            - PORT=8080
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            - DB_WRITE_HOST=${DB_WRITE_HOST:-postgres-primary}
            - DB_READ_HOST=${DB_READ_HOST:-postgres-primary}
            - DB_PORT=${DB_PORT:-5432}
            - DB_NAME=${DB_NAME}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - DDL_AUTO=update

networks:
    notebookum-network:
        external: true
    internal-network:
        internal: true