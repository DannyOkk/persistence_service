services:

    # ─── BASE DE DATOS ────────────────────────────────────────────────────────
    postgres-primary:
        image: postgres:16
        restart: unless-stopped
        environment:
            - POSTGRES_DB=${DB_NAME}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        networks:
            - internal-network
        labels:
            - "traefik.enable=false"

    # ─── REDIS ────────────────────────────────────────────────────────────────
    redis:
        image: redis:alpine
        restart: unless-stopped
        networks:
            - internal-network
        labels:
            - "traefik.enable=false"

    # ─── APLICACIÓN ──────────────────────────────────────────────────────────
    persistence-java:
        build: .
        image: notebookum-persistence-java:v1.0.0
        restart: unless-stopped
        depends_on:
            - postgres-primary
            - redis
        # LOAD BALANCER PATTERN
        deploy:
            replicas: 2
        networks:
            notebookum-network:
                aliases:
                    - persistence-java.universidad.localhost
            internal-network:
                aliases:
                    - persistence-java-db
        environment:
            - PORT=8080
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            - DB_WRITE_HOST=${DB_WRITE_HOST:-postgres-primary}
            - DB_READ_HOST=${DB_READ_HOST:-postgres-primary}
            - DB_PORT=${DB_PORT:-5432}
            - DB_NAME=${DB_NAME}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - DDL_AUTO=update
            # Consul Service Discovery
            - CONSUL_HOST=consul
            - CONSUL_PORT=8500

networks:
    notebookum-network:
        external: true
    internal-network:
        internal: true